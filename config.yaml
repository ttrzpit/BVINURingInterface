%YAML:1.0
---
# =============================================================================
# BVI NURing Interface - Runtime Configuration
#
# Edit this file to change parameters without recompiling the program.
# Uses OpenCV's FileStorage YAML format (no extra dependencies).
# =============================================================================


# === Aruco Detector Parameters ===============================================
aruco_marker:
   marker_size_mm: 20.0   # Physical side length of ring markers [mm] - used for pose estimation
   valid_id_min: 0        # Discard detected markers with ID below this
   valid_id_max: 200       # Discard detected markers with ID above this


# ---- ArUco Detector Algorithm Parameters ------------------------------------
aruco_detector:
   adaptive_thresh_constant:     5           # 5      Constant subtracted from the local mean during adaptive thresholding, which converts the grayscale image to binary before contours are searched for marker borders. Higher values produce a stricter (darker) threshold, rejecting faint/low-contrast edges; lower values pick up more edges but add noise. OpenCV default is 7.
   adaptive_thresh_win_size_min: 13           # 3      Smallest local window size (pixels) used by the adaptive threshold step. Smaller windows adapt to fine local lighting variation but are noisier; this is the starting size of the win_size_min..max..step sweep run at multiple scales to find markers under uneven illumination.
   adaptive_thresh_win_size_max: 23          # 23     Largest local window size (pixels) used by the adaptive threshold sweep. Larger windows tolerate broader lighting gradients and help detect markers farther from the camera (where they appear smaller), at the cost of extra thresholding passes and slower detection.
   adaptive_thresh_win_size_step: 10         # 10     Step size (pixels) between adaptive_thresh_win_size_min and _max - the detector reruns thresholding at each window size in this sequence. A larger step means fewer passes (faster) but coarser coverage of lighting scales; a smaller step is slower but more thorough.

   # Marker geometry filters: reject detections that are too small/large/imprecise.
   min_marker_perimeter_rate:      0.05      # 0.03   Minimum marker contour perimeter, as a fraction of the maximum image dimension, for a candidate to be considered. Smaller values allow smaller (more distant) markers to be detected but increase false positives from noise; larger values filter out tiny spurious contours. Raised 0.03->0.05 to cull tiny spurious contours at close range before decode/refinement (watch far-range acquisition).
   max_marker_perimeter_rate:      4.0       # 4.0    Maximum marker contour perimeter, as a fraction of the maximum image dimension, for a candidate to be considered. Values above 4.0 (i.e. larger than the image itself) effectively disable this upper bound, so only min_marker_perimeter_rate filters out implausibly large contours.
   polygonal_approx_accuracy_rate: 0.03      # 0.03   Relative accuracy (as a fraction of the contour perimeter) used by cv::approxPolyDP when reducing each candidate contour to a 4-corner polygon. Smaller values demand a tighter fit to 4 corners (rejecting non-square shapes) but can fail on slightly distorted markers; larger values are more permissive.
   min_corner_distance_rate:       0.05      # 0.05   Minimum allowed distance between any two corners of a candidate marker, as a fraction of its perimeter. Candidates whose corners are closer together than this (degenerate/collapsed quads) are rejected as noise rather than real markers.
   min_distance_to_border:         3         # 3      Minimum distance, in pixels, that every corner of a detected marker must be from the image border. Markers partially cut off by the frame edge (corners closer than this) are rejected, since their pose/ID cannot be reliably estimated.

   # Corner refinement improves 3D pose accuracy at a small speed cost.
   corner_refinement_method:         2       # 1      Corner refinement. NOTE: no longer applied to ALL detected markers (refining 450+ markers/frame on the dense Fitts board caused the mid-range detector lag). Now applied ONLY to the active guidance target, in RunDetection(). 1 = subpixel (cv::cornerSubPix) refines the target; 0 = no target refinement (fastest); 2/3 (contour/AprilTag) aren't reproducible per-marker so the target is left unrefined. All other markers use the raw detectMarkers() corners, which the board homography averages over by least squares anyway.
   corner_refinement_max_iterations: 30      # 30     Maximum number of iterations the corner refinement algorithm (set by corner_refinement_method) runs per marker. More iterations can improve accuracy slightly but increase per-marker processing time; refinement stops early if corner_refinement_min_accuracy is reached first.
   corner_refinement_min_accuracy:   0.01    # 0.01   Convergence threshold (in pixels) for corner refinement: refinement stops once corner positions change by less than this between iterations, or corner_refinement_max_iterations is reached, whichever comes first. Smaller values demand tighter convergence (slower, more precise).
   object_corner_refinement_method:  2       # 2      Detector-level corner refinement for OBJECTS mode ONLY (the DICT_6X6_100 detector). Unlike the dense Fitts board, the OBJECTS scene holds <=~20 markers, so refining every marker inside detectMarkers() is cheap. 2 = contour (fits lines to the FULL marker edges - hundreds of gradient samples each - and intersects them; far more stable corners than an 11x11 subpixel patch, recommended); 3 = AprilTag (most accurate in benchmarks, slower - watch the detection Hz readout); 1 = subpixel; 0 = none. Compare settings with the 'D' corner-jitter probe.

   # Detect markers on glossy/reflective surfaces that invert the black/white pattern.
   detect_inverted_marker: 0                 # 0      When enabled (1), also searches for markers printed with inverted polarity (white pattern on black background), in addition to the normal black-on-white markers. Useful for markers viewed on a backlit screen or a reflective/glossy surface where contrast can invert. Roughly doubles detection cost when on.

   # Bit-decoding strictness - how many flipped bits the decoder will repair.
   error_correction_rate: 0.6                # 0.6    Fraction of a marker's error-correction capacity the decoder may use to fix flipped bits before rejecting the candidate. OpenCV default 0.6 (lenient); on the low-Hamming-distance DICT_4X4_1000 board, lowering it (e.g. 0.4) rejects marginal candidates - fewer phantom markers from noise/blur up close and less corner-refinement work, so detectMarkers() runs faster. Currently at the 0.6 default; lower it if phantom decodes reappear.

   # Perspective removal - resolution of the internal bit-extraction step.
   perspective_remove_pixel_per_cell:          8      # 8      Resolution, in pixels per bit-cell, used when the detector warps each candidate marker to a flat square to read its black/white bit pattern. Higher values sample each cell more finely (more accurate bit decoding, especially at oblique angles) at the cost of extra processing per marker.
   perspective_remove_ignored_margin_per_cell: 0.13    # 0.13   Fraction of each bit-cell's width/height, around its edge, that is ignored when sampling that cell's color during bit decoding. Avoids letting blur or imperfect perspective correction near a cell's border bias the black/white decision toward the wrong value.

   # ArUco3 detection - faster and more robust algorithm for small/distant markers.
   use_aruco3_detection: 0   # 0 Enables the newer ArUco3 detection pipeline, which adds a fast low-resolution pre-pass to locate marker candidates before refining them at full resolution. Generally faster and better at finding small or distant markers than the legacy pipeline, at the cost of some extra tuning parameters (not exposed here).


# ---- ArUco Marker Display (on the touchscreen) ------------------------------
# The C x R grid starts at marker ID 1 and increments left-to-right, top-to-bottom.
# Spacing between markers is auto-calculated from screen size, padding, and marker size.
aruco_display:
   cols: 9                # Number of grid columns
   rows: 5                # Number of grid rows
   marker_size_mm: 20.0   # Marker side length [mm] - converted to pixels at runtime
   padding_mm: 60.0       # Padding on all 4 sides [mm] - converted to pixels at runtime

# ---- ArUco Calibration Grid (on the touchscreen) --------------------------------
# The C x R grid starts at marker ID 1 and increments left-to-right, top-to-bottom.
# Spacing between markers is auto-calculated from screen size, padding, and marker size.
# Uses the larger ArUco dictionary 4x4x250
aruco_calibration_grid:
   marker_size_mm: 8.0       # Marker side length [mm] - converted to pixels at runtime
   marker_pad_mm: 8.0        # Padding between markers [mm] - converted to pixels at runtime
   marker_exclusion_mm: 80.0  # Exclusion zone around the aruco grid to keep markers away from the screen edge


# ---- Camera -----------------------------------------------------------------
camera:
   # device: "/dev/video0" # Original camera
   device:  "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:1.3:1.0-video-index0"    # Ring camera
   device2: "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:1.4:1.0-video-index0"    # Stage camera
   width: 1600    # 1600
   height: 1200   # 1200
   framerate: 90
   rotate_180: 0          # 1 = flip camera image 180 degrees (upside-down mount)
   detect_on_clahe: 1     # 1 = run ArUco detection on the CLAHE-equalized gray (current
                          #     behaviour); 0 = detect on the plain gray. CLAHE is
                          #     content-adaptive: frame-to-frame noise changes each tile's
                          #     contrast mapping, which MOVES marker edges slightly and adds
                          #     corner jitter. On a well-lit board try 0 and compare with the
                          #     'D' corner-jitter probe.

   # Intrinsic parameters from camera calibration (high-resolution mode)
   fx: 600.98172          # Horizontal focal length [px]
   fy: 599.86930          # Vertical focal length [px]
   cx: 801.26194          # Principal point X [px]
   cy: 535.69455          # Principal point Y [px]

   # Radial/tangential distortion coefficients [k1, k2, p1, p2, k3]
   distortion: [ 0.01561, -0.03298, 0.00020, 0.00136, 0.00561 ]

   # Hardware settings (tuned for indoor ArUco detection)
   brightness:          0     # 0   
   contrast:            0     # 0   
   saturation:          32    # 32 
   hue:                 0     # 0
   auto_white_balance:  0     # 0 
   gamma:               120   # 120   
   gain:                18    # 18
   sharpness:           0     # 0
   backlight:           0     # 0
   auto_exposure:       1     # 1 = manual, 3 = aperture priority
   exposure_level:      48    # 48
   auto_focus:          0     # 0
   focus_level:         0     # 0
   zoom:                0     # 0


# ---- Operator Display (main monitor) ----------------------------------------
display:
   width: 1600
   height: 1070
   x_pos: 1830
   y_pos: 0



# ---- Touchscreen Monitor ----------------------------------------------------
touchscreen:
   width: 1920
   height: 1080
   x_offset: 3440         # X offset of the touchscreen in the desktop coordinate space
   y_offset: 0            # Y offset of the touchscreen (0 if monitors are top-aligned)
   pixels_per_mm: 3.6430  # Physical pixel density of the touchscreen [px/mm]
   mm_per_pixel:  0.27450 # Inverse conversion - use whichever direction is convenient
   xinput_device_id: 9    # xinput device ID for the touchscreen (run 'xinput list' to find it)
   xinput_output: "HDMI-0" # X output name to map the touchscreen to (run 'xrandr' to find it)


# ---- Telemetry Panel (1600x270, directly below the operator display) ---------
# Grid: 50 columns x 6 rows. Cell size = width/cols x height/rows = 32x45 px.
# y_pos: set to operator display height + window title bar (~30 px).
telemetry:
   width: 1600
   height: 256
   cols: 47
   rows: 8
   x_pos: 1830
   y_pos: 1200

controller:
   width: 450
   height: 1350
   cols: 15
   rows: 45
   x_pos: 1372
   y_pos: 0


# ---- Calibration Stage 1 timing (AROM) ---------------------------------------
cal1:
   record_secs: 5.0     # Duration of the AROM circle-tracing recording [s]

# ---- Calibration Stage 2 timing (Stiffness) ------------------------------------
cal2:
   force_ramp_rate:   0.5  # Open-loop force ramp-up rate [N/s]
   hold_secs:         2.0  # Hold duration at peak force per heading [s]
   release_wait_secs: 3.0  # Wait after releasing (no ramp-down) before the next heading [s]

# ---- Calibration Stage 3 timing ---------------------------------------------
cal3:
   hold_secs:     0.05   # Seconds the screen must be held before a sample is recorded
   cooldown_secs: 0.5    # Seconds to wait between successive samples
   max_samples:   10     # Number of touches required to complete calibration


# ---- Fitts board (explicit multi-scale placement for the FITTS task) ----------
# Two-level nested fiducial board in DICT_4X4_1000. All positions are marker
# CENTRES in screen-plane mm (origin = screen top-left):
#   - fine markers (subset B): dense grid laid out from the first marker's
#     centre, stepping by (size + pad) centre-to-centre over rows x cols. These
#     are the close-range reference AND the pointing targets; IDs run 1.. row-major.
#   - coarse markers (subset A): four large markers at the explicit centres
#     below, drawn on top of the fine grid; IDs follow the fine band.
# NOTE: fine cells under a coarse marker are overdrawn (won't decode); avoid
# selecting those as targets, or ask to auto-skip them.
fitts_board_assignments:
   fine_marker_size_mm:       8.0      # Fine marker side length [mm]
   fine_marker_pad_mm:        8.0      # Gap between fine markers [mm] (pitch = size + pad = 16 mm)
   fine_marker_first_x_mm:    31.50    # First marker center x-coordinate [mm]
   fine_marker_first_y_mm:    36.23    # First marker center y-coordinate [mm]  
   fine_marker_rows:          15       # Number of rows
   fine_marker_cols:          30       # Number of columns
   coarse_marker_size_mm:     56.0     # Coarse marker side length [mm]
   coarse_marker_x1:          39.5     # Coarse marker 1 center x-coordinate [mm]
   coarse_marker_y1:          44.5     # Coarse marker 1 center x-coordinate [mm]
   coarse_marker_x2:          487.5    # Coarse marker 1 center x-coordinate [mm]
   coarse_marker_y2:          44.5     # Coarse marker 1 center x-coordinate [mm]
   coarse_marker_x3:          39.5     # Coarse marker 1 center x-coordinate [mm]
   coarse_marker_y3:          252.23   # Coarse marker 1 center x-coordinate [mm]
   coarse_marker_x4:          487.5    # Coarse marker 1 center x-coordinate [mm]
   coarse_marker_y4:          252.23   # Coarse marker 1 center x-coordinate [mm]
   # ---- Random target selection ----
   select_border_rows:        2        # Exclude this many fine rows at the top & bottom from random selection
   select_border_cols:        1        # Exclude this many fine cols at the left & right from random selection
   num_distance_bands:        5        # Distance bands cycled for an even spread of movement distances
   # Marker IDs to exclude from the random ("r") target pool. Still rendered and
   # detected for pose/guidance - just never picked as random targets. Add/remove
   # IDs here (YAML inline list). Leave as [] for no exclusions.
   random_target_excluded_ids: [1, 2, 23, 24, 25, 26, 47, 48, 49, 50, 71, 72, 73, 74, 75, 76, 99, 100, 101, 102, 103, 104, 105, 130, 131, 132, 133, 134, 135, 160, 161, 162, 343, 366, 367, 390, 391, 414]
   
# ---- Accuracy trials (manual random-target debug pool) ------------------------
# random_pool: a list of fine marker IDs that the Fitts 'r' key cycles through,
# in random order without repeating, for manual/debug target selection. Each 'r'
# press picks one unused ID from this pool. Once every ID has been used, the
# program prints "Moving outside of random pool, selecting new random value" and
# reverts to the normal whole-board random target picker. The pool is refreshed
# each time the FITTS task is entered. Leave as [] to disable (normal picker).
accuracy_trials:
   random_pool:   [354] # [57, 111, 124, 267, 275, 286] 
   target_set_01: [51, 52, 53, 77, 78, 79, 80, 106, 107, 108, 109, 110, 136, 137, 138, 139, 140 ]
   target_set_02: [54, 55, 56, 57, 58, 59, 60, 81, 82, 83, 84, 85, 86, 87, 111, 112, 113, 114, 115, 116, 117, 141, 142, 143, 144, 145, 146, 147 ]
   target_set_03: [61, 62, 63, 64, 65, 66, 67, 88, 89, 90, 91, 92, 93, 94, 118, 119, 120, 121, 122, 123, 124, 148, 149, 150, 151, 152, 153, 154 ]
   target_set_04: [68, 69, 70, 95, 96, 97, 98, 125, 126, 127, 128, 129, 155, 156, 157, 158, 159 ]
   target_set_05: [164, 165, 166, 167, 168, 169, 170, 194, 195, 196, 197, 198, 199, 200, 224, 225, 226, 227, 228, 229, 230, 254, 255, 256, 257, 258, 259, 260 ]
   target_set_06: [171, 172, 173, 174, 175, 176, 177, 201, 202, 203, 204, 205, 206, 207, 231, 232, 233, 234, 235, 236, 237, 261, 262, 263, 264, 265, 266, 267 ]
   target_set_07: [178, 179, 180, 181, 182, 183, 184, 208, 209, 210, 211, 212, 213, 214, 238, 239, 240, 241, 242, 243, 244, 268, 269, 270, 271, 272, 273, 274 ]
   target_set_08: [185, 186, 187, 188, 189, 190, 191, 215, 216, 217, 218, 219, 220, 221, 245, 246, 247, 248, 249, 250, 251, 275, 276, 277, 278, 279, 280, 281 ]
   target_set_09: [284, 285, 286, 287, 288, 289, 290, 314, 315, 316, 317, 318, 319, 320, 344, 345, 346, 347, 368, 369, 370, 371 ]
   target_set_10: [291, 292, 293, 294, 295, 296, 297, 321, 322, 323, 324, 325, 326, 327, 348, 349, 350, 351, 352, 353, 354, 372, 373, 374, 375, 376, 377, 378 ]
   target_set_11: [298, 299, 300, 301, 302, 303, 304, 328, 329, 330, 331, 332, 333, 334, 355, 356, 357, 358, 359, 360, 361, 379, 380, 381, 382, 383, 384, 385 ]
   target_set_12: [305, 306, 307, 308, 309, 310, 311, 335, 336, 337, 338, 339, 340, 341, 362, 363, 364, 365, 386, 387, 388, 389 ]


# === Object-Guidance World (OBJECTS mode, 'O') =================================
# A physical ArUco "world board" (marker_positions, ids 1-45) establishes a rig
# world frame, a set of physical objects (target_objects, ids 60-72), each
# tagged by an ArUco marker, are guided to, and two ring markers (ring_markers,
# ids 73/74) on the hand track the fingertip live. ALL markers here use
# DICT_6X6_100 - a different dictionary from the Fitts/Cal DICT_4X4_* grids, so
# OBJECTS mode swaps the detector. Ported from the ~/Code/ArUcoTest prototype.
#
# Frame (marker's own frame, mm): origin = marker centre, +X right, +Y up,
#   +Z out of the marker face (toward the camera). Object body extends toward -Z.
#
# World board frame (marker_positions): a single GROUND PLANE at y = 0 spanning
#   X/Z (world +Y = up). The old second "wall" plane (z = 0, spanning X/Y) has
#   been removed; wall entries (y != 0) are still parsed if ever re-added.
object_world:

   # Physical side length of the WORLD board markers [mm]. Used (with the marker
   # centres below) to derive each marker's 4 corner positions in the world frame
   # for the corner-based world PnP - which is what lets a SINGLE visible world
   # marker localise the world (the old centre-based solve needed >= 4).
   world_marker_size_mm: 64.0

   # Draw the known-layout reprojection: once a world pose is solved, EVERY
   # configured world marker's expected outline is reprojected into the operator
   # view (dark blue). Squares that miss the printed markers reveal a wrong
   # marker size / position / mounting convention at a glance. Diagnostic -
   # leave 0 for normal runs.
   show_known_layout: 0

   # Number of detection frames averaged by a 't' training burst. Objects are
   # mapped into the world frame ONLY by training ('t'): each burst frame with
   # a valid world pose contributes one marker->world sample per visible object;
   # translation is averaged and rotation SVD-orthonormalized into a locked
   # anchor, so a trained object holds a low-noise pose off the world board
   # alone. ~20 frames is about 0.25 s - hold the camera steady during a burst.
   train_frames: 60

   # Detection frames of the 'r' presence re-scan. Pressing 'r' first re-checks
   # which TRAINED object markers are actually still visible for this many
   # frames (an object counts as present when its marker is seen on at least a
   # few of them); only present objects stay in the random pool, so a
   # physically removed object is never selected again. ~30 frames is ~0.4 s.
   presence_scan_frames: 30

   # Roll trim [deg] for orienting the Cal3 fingertip offset in OBJECTS mode.
   # LEGACY FALLBACK ONLY: used when no rig alignment has been captured (no
   # rig_alignment.yaml) or no world pose is available. The preferred path is the
   # one-time rig-alignment capture (press 'R' from IDLE with the touchscreen grid
   # AND the world board both in view): it measures the full screen->world rotation
   # into rig_alignment.yaml and OBJECTS then rotates the Cal3 offset by the live
   # world->camera pose automatically - no per-participant/per-trial tuning and no
   # need for this trim. Only re-run 'R' if the screen or world board physically
   # moves. Leave this at 0.0 once rig alignment is captured.
   roll_offset_deg: 0.0

   # --- World board marker centres (id -> XYZ mm) in the rig/world frame ------
   # IMPORTANT: these ARE the world geometry used to solve the world->camera pose
   # each frame (marker corners, derived from centre + world_marker_size_mm).
   # Their ACCURACY directly sets stability and accuracy: ~1 mm positions give a
   # steady, sub-mm pose; several-mm errors reintroduce jitter and a constant
   # target offset. Measure them as precisely as possible (ideally from the
   # board's design/print layout).
   # MOUNTING CONVENTION (assumed by the corner-based pose): ground-plane
   # markers (y = 0) lie face-up with their printed top edge toward the z = 0
   # row (ids 1-9), i.e. along world -Z. (Legacy wall markers, y != 0, would be
   # upright with the printed top edge along world +Y.)
   marker_positions:
      - { id: 1, x: -350, y: 0, z: 0 }
      - { id: 2, x: -262.5, y: 0, z: 0 }
      - { id: 3, x: -175, y: 0, z: 0 }
      - { id: 4, x: -87.5, y: 0, z: 0 }
      - { id: 5, x: 0, y: 0, z: 0 }
      - { id: 6, x: 87.5, y: 0, z: 0 }
      - { id: 7, x: 175, y: 0, z: 0 }
      - { id: 8, x: 262.5, y: 0, z: 0 }
      - { id: 9, x: 350, y: 0, z: 0 }
      - { id: 10, x: -350, y: 0, z: 87.5 }
      - { id: 11, x: -262.5, y: 0, z: 87.5 }
      - { id: 12, x: -175, y: 0, z: 87.5 }
      - { id: 13, x: -87.5, y: 0, z: 87.5 }
      - { id: 14, x: 0, y: 0, z: 87.5 }
      - { id: 15, x: 87.5, y: 0, z: 87.5 }
      - { id: 16, x: 175, y: 0, z: 87.5 }
      - { id: 17, x: 262.5, y: 0, z: 87.5 }
      - { id: 18, x: 350, y: 0, z: 87.5 }
      - { id: 19, x: -350, y: 0, z: 175 }
      - { id: 20, x: -262.5, y: 0, z: 175 }
      - { id: 21, x: -175, y: 0, z: 175 }
      - { id: 22, x: -87.5, y: 0, z: 175 }
      - { id: 23, x: 0, y: 0, z: 175 }
      - { id: 24, x: 87.5, y: 0, z: 175 }
      - { id: 25, x: 175, y: 0, z: 175 }
      - { id: 26, x: 262.5, y: 0, z: 175 }
      - { id: 27, x: 350, y: 0, z: 175 }
      - { id: 28, x: -350, y: 0, z: 262.5 }
      - { id: 29, x: -262.5, y: 0, z: 262.5 }
      - { id: 30, x: -175, y: 0, z: 262.5 }
      - { id: 31, x: -87.5, y: 0, z: 262.5 }
      - { id: 32, x: 0, y: 0, z: 262.5 }
      - { id: 33, x: 87.5, y: 0, z: 262.5 }
      - { id: 34, x: 175, y: 0, z: 262.5 }
      - { id: 35, x: 262.5, y: 0, z: 262.5 }
      - { id: 36, x: 350, y: 0, z: 262.5 }
      - { id: 37, x: -350, y: 0, z: 350 }
      - { id: 38, x: -262.5, y: 0, z: 350 }
      - { id: 39, x: -175, y: 0, z: 350 }
      - { id: 40, x: -87.5, y: 0, z: 350 }
      - { id: 41, x: 0, y: 0, z: 350 }
      - { id: 42, x: 87.5, y: 0, z: 350 }
      - { id: 43, x: 175, y: 0, z: 350 }
      - { id: 44, x: 262.5, y: 0, z: 350 }
      - { id: 45, x: 350, y: 0, z: 350 }

   # --- Ring markers (live fingertip tracking on the moving hand) -------------
   # Two markers on a rigid ring mount track the fingertip in the camera frame:
   # fingertip = base marker pose * fingertip_offset. When the base marker is
   # occluded, its pose is reconstructed from the second marker via the fixed
   # 73<-74 rigid transform. That transform is LEARNED LIVE whenever both
   # markers are visible in the same frame (absorbing mount build tolerance);
   # until then it is derived from relationship_angle assuming the two marker
   # planes meet at the base marker's printed top edge (fold about that edge).
   # The measured fingertip replaces the Cal3 rigid camera->fingertip offset in
   # OBJECTS guidance whenever it is available (robust to finger deflection).
   ring_markers:
      base_marker:        50   # Fingertip reference marker (fingertip_offset is in ITS frame)
      second_marker:      51   # Companion marker, folded about 73's printed top edge
      relationship_angle: 45   # Fold angle between the two marker planes [deg]
      marker_size_mm:     40   # Printed side length of BOTH ring markers [mm]
      fingertip_offset:   { x: 0, y: -40, z: -15 }   # Fingertip in 73's frame [mm]
      # Yaw trim [deg] about the ARROW axis for the arrow-frame guidance error.
      # The OBJECTS error vector is expressed in the arrow frame (X = right
      # across the finger, Y = up out of 50's face, Z = along the arrow /
      # distance to go). The frame is already right-handed and sign-correct in
      # code (see the Sx handedness fix in WorldObjectHandler), so 0 is normal.
      # This ROTATES the X/Y error axes about the arrow only for a residual
      # rotational mount misalignment (e.g. 90 if the marker is mounted turned
      # a quarter-turn). It CANNOT flip a single axis - that is a reflection,
      # handled by the code fix, not by this trim. Tune with output off,
      # watching the Guiding Pos row.
      arrow_yaw_trim_deg: 0

   # --- Object marker IDs to randomise among for the 'r' selection -----------
   object_marker_pool: [ 60, 61, 62, 70, 71, 72 ]

   # --- Virtual objects tagged by object markers -----------------------------
   # type: "cylinder" (general) - base_origin_mm + base_normal_mm + radius + height.
   #   target_point_mm is relative to base_origin_mm.
   # type: "box" - 8 explicit corner points (marker-frame mm), order:
   #   top UL/UR/BL/BR then bottom UL/UR/BL/BR. target_point_mm is relative to
