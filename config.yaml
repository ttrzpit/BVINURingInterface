# ---- Fitts target circle ------------------------------------------------------
# radius_mm         : Drawn target circle radius [mm]
# offset_default_mm : Default Y offset (below the tag center) shown as a gray
#                      circle before Cal3 completes [mm]. Once Cal3 is complete,
#                      the cal3-calibrated offset is used instead (red circle).
target:
   radius_mm: 5.0
   offset_default_mm: 32.0

# ---- Gesture detection (flick up/down + confirm circle, RobotState::READY only) ----
# velocity_thresh_mm_s : |vel_filtered_.y| must exceed this to arm a flick [mm/s]
# arm_samples          : Consecutive over-threshold samples required to arm a flick
# min_displacement_mm  : Net |dy| required within max_window_secs to confirm a flick [mm]
# max_window_secs      : Max time after arming to confirm flick displacement [s]
# cooldown_secs        : Min gap between raw flicks; also the on-screen arrow duration [s]
# double_flick_window_secs : Max time between two same-direction raw flicks for them to
#                             register as a single FLICK_UP/FLICK_DOWN [s]
#
# rest_speed_thresh_mm_s : |vel_filtered_| below this counts as "at rest" [mm/s]
# flick_max_motion_secs  : Max continuous time spent moving (since last at rest) for a
#                          velocity spike to still count as a flick [s] - sustained motion
#                          (a circle) exceeds this and blocks flick arming
# circle_confirm_rad     : Cumulative rotation to confirm a "draw a circle" gesture [rad] (~300 deg)
# circle_max_window_secs : Rolling time window for rotation accumulation [s]
# circle_min_radius_mm   : Min path radius from centroid - rejects jitter loops [mm]
# circle_max_radius_mm   : Max path radius from centroid - rejects large sweeps [mm]
# circle_cooldown_secs   : Min gap between confirms; also the on-screen indicator duration [s]
gesture:
   velocity_thresh_mm_s: 80.0
   arm_samples: 2
   min_displacement_mm: 3.0
   max_window_secs: 0.25
   cooldown_secs: 0.4
   double_flick_window_secs: 0.5

   rest_speed_thresh_mm_s: 8.0
   flick_max_motion_secs: 0.3
   circle_confirm_rad: 4.19
   circle_max_window_secs: 1.5
   circle_min_radius_mm: 3.0
   circle_max_radius_mm: 50.0
   circle_cooldown_secs: 0.6

# ---- Serial (Teensy) --------------------------------------------------------
serial:
   port: "/dev/ttyACM0"   # Single full-duplex USB CDC port
   baud_rate: 1000000     # 1 Mbaud (nominal for USB CDC; actual speed is USB-limited)

# ---- Controller gains and tension allocation parameters -----------------------
# gain_kP           : Starting value [N/mm] for the custom-tuned proportional
#                     gain (gainTune_A/B/C, adjustable live via 'P'). Combined
#                     with K(theta) (stiffness calibration) to form kP_effective.
# gain_kD           : Derivative gain [N·s/mm]
# gain_kI           : Starting value [N/(mm·s)] for the custom-tuned integral
#                     gain (iGainTune_A/B/C, adjustable live via 'I'). Drives the
#                     gated "endgame" integrator below to cancel steady-state
#                     bias (e.g. the fingertip settling below the target in y).
# integral_enable_radius_mm  : Integrator winds up only within this error radius [mm]
# integral_z_based           : 0 = radius is the in-plane (X/Y) error only (depth ignored);
#                              1 = radius is the full 3D fingertip-to-target distance, so it
#                                  includes Z depth (a true sphere around the target centre)
# integral_enable_speed_mm_s : ...and only below this finger speed [mm/s] (final settling)
# integral_leak              : Per-frame decay of the integral while not winding up (0-1)
# deflection_force_max : Maximum commanded guidance deflection force magnitude [N] (Stage 1, task space)
#
# Stage 2 tension allocation: T_output = T_preload + T_deflection, per motor
# tension_preload_min   : T_preload_min - minimum preload tension per motor [N]
# tension_preload_max   : T_preload_max - maximum preload tension per motor [N]
# tension_deflection_max: T_deflection_max - max per-motor tension contribution from
#                         the guidance/deflection force [N]
# tension_output_max    : T_output_max - max total commanded tension per motor
#                         (T_preload + T_deflection) [N]
#
# position_tolerance: Deadband radius - no force applied inside this radius [mm]
# lowpass_alpha     : Velocity low-pass filter coefficient (0 = heavy, 1 = none)
# ramp_type         : How guidance force ramps up to full power
#                       0 = no ramp (full output immediately)
#                       1 = startup ramp (time-based; ramps over ramp_duration_secs
#                           after a new target is selected)
#                       2 = distance ramp (ramps as the fingertip-to-target depth
#                           closes; see initial_ramp_percentage)
# ramp_duration_secs   : Startup-ramp (ramp_type 1) duration when a new target appears [s]
# initial_ramp_percentage : Distance-ramp (ramp_type 2) only. Fraction of the starting
#                           fingertip-to-target depth that must be closed before guidance
#                           reaches full power, e.g. 0.2 = ramp over the first 20%. Starting
#                           at 1000 mm with 0.2 reaches full power at 800 mm. The depth is
#                           captured at first detection of each new target, and the ramp is
#                           one-directional: retreating (depth increasing) never reverses it.
# max_current_amps     : Amplifier current limit [A]
# encoder_counts_per_rev : Encoder ticks per full motor revolution
controller_gains:
   gain_kP: 0.0
   gain_kD: 0.0
   gain_kI: 0.05
   integral_enable_radius_mm: 100.0
   integral_z_based: 0          # 0 = in-plane (X/Y) radius, 1 = 3D distance incl. Z depth
   integral_enable_speed_mm_s: 100.0
   integral_leak: 0.95
   deflection_force_max: 20.0
   tension_preload_min: 0.1
   tension_preload_max: 2.0
   tension_deflection_max: 6.0
   tension_output_max: 6.0
   position_tolerance: 1.0
   lowpass_alpha: 0.15
   ramp_type: 2                     # 0 = none, 1 = startup (time) ramp, 2 = distance ramp
   ramp_duration_secs: 5.0
   initial_ramp_percentage: 0.5    # ramp_type 2: ramp to full power over the first 20% of depth closed
   max_current_amps: 1.89
   encoder_counts_per_rev: 4096

